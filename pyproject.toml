[project]
name = "stavsboard"
version = "0.1.0"
description = "A calm, read-only system dashboard for one machine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6.0",
    "docker>=7.1",
]

[project.scripts]
stavsboard = "stavsboard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stavsboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
